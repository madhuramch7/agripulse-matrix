<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPulse Matrix - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-emerald-800">AgriPulse Matrix</h1>
            <p class="text-gray-500 mt-2">Smart Agricultural Intelligence Platform</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" required placeholder="farmer@agripulse.com"
                    class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" required placeholder="••••••••"
                    class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <button type="submit" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                Sign In
            </button>
        </form>

        <div id="statusMessage" class="mt-4 text-center text-sm font-medium hidden"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('statusMessage');

            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
            if (response.ok) {
                statusDiv.textContent = "Login Successful! Redirecting...";
                statusDiv.className = "mt-4 text-center text-sm font-medium text-emerald-600";
                statusDiv.classList.remove('hidden');

                // Redirect after 1 second so the user sees the success message
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1000);
            } else {
                statusDiv.textContent = "Invalid credentials. Please try again.";
                statusDiv.className = "mt-4 text-center text-sm font-medium text-red-600";
                statusDiv.classList.remove('hidden');
            }
            } catch (err) {
                statusDiv.textContent = "Backend connection failed. Ensure Spring Boot is running.";
                statusDiv.className = "mt-4 text-center text-sm font-medium text-red-600";
                statusDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
